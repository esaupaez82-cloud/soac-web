<!doctype html>
<html lang="es-MX"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Cotizador de financiamiento · SOAC</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f3f3;color:#202024;font:16px system-ui,sans-serif}main{max-width:64rem;margin:auto;padding:clamp(1rem,4vw,2rem)}header,section{background:white;border:1px solid #dedee2;border-radius:1rem;padding:1rem;margin-bottom:1rem}header{border-top:4px solid #a90020}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr));gap:.8rem}label{display:grid;gap:.25rem}button,input,select{min-height:2.7rem;padding:.5rem;border:1px solid #aaa;border-radius:.5rem;font:inherit}button{background:#a90020;color:white;cursor:pointer}.actions{margin-top:1rem}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:.6rem;text-align:right;border-bottom:1px solid #ddd;white-space:nowrap}#error{color:#a00020}@media print{body{background:white}.actions,form,header a{display:none}main{padding:0}}
</style>
<main>
<header><a href="/modulo-02.html">Centro Digital</a><h1>Cotizador de financiamiento</h1><p>Automotriz CLASA® · Simulación sujeta a confirmación y evaluación.</p><p id="case" hidden></p></header>
<section><form id="form">
<div class="grid">
<label>Modelo (año)<input name="year" type="number" min="1900" required></label>
<label>Precio de venta (MXN)<input name="price" type="number" min="1" max="100000000" step=".01" required></label>
<label>Enganche (MXN)<input name="down" type="number" min=".01" step=".01" required><small id="minimum"></small></label>
<label>Esquema<select name="lender"><option value="CLASA">CLASA directo</option><option value="Confirmada">Financiera · condiciones confirmadas</option></select></label>
<label>Plazo<select name="months"></select></label>
<label>Seguro de contado (MXN)<input name="insurance" type="number" min="0" step=".01" placeholder="Por cotizar"></label>
<label id="rate-label" hidden>Tasa mensual confirmada (%)<input name="monthlyRate" type="number" step=".0001" min="0" max="100"></label>
<label id="opening-label" hidden>Apertura confirmada (%)<input name="openingPercent" type="number" step=".01" min="0" max="100"></label>
</div>
<div class="actions"><button>Calcular</button></div><p id="error" role="alert"></p>
</form></section>
<section id="result" hidden><h2>Simulación de pago</h2><dl id="summary"></dl>
<p id="note"></p><div class="table"><table><thead><tr><th>Mes</th><th>Capital</th><th>Interés</th><th>GPS</th><th>Pago</th><th>Saldo</th></tr></thead><tbody id="payments"></tbody></table></div>
<div class="actions"><button id="print">Imprimir o guardar PDF</button></div></section>
</main>
<script type="module">
import {terms, gps, referenceDownPercent, quoteFinancing} from './financiamiento-calculo.mjs';
const el=id=>document.getElementById(id);
const form=el('form'), fields=form.elements;
const format=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'});
const money=value=>format.format(value);
const session=await fetch('/api/auth?action=session',{cache:'no-store'});
if(!session.ok){location.replace('/firebase-login.html');throw Error('Sesión requerida');}
const folio=new URLSearchParams(location.search).get('folio');
if(folio){el('case').textContent='Folio Centro Digital · '+folio.slice(0,200);el('case').hidden=false;}
function update(){
 const year=fields.year.valueAsNumber;
 const direct=fields.lender.value==='CLASA';
 const allowed=year<=2011?[12,18]:terms;
 const previous=Number(fields.months.value);
 fields.months.replaceChildren(...allowed.map(month=>new Option(month+' meses',month)));
 if(allowed.includes(previous))fields.months.value=previous;
 fields.lender.options[1].disabled=year<=2011;
 if(year<=2011)fields.lender.value='CLASA';
 for(const [id,key] of [['rate-label','monthlyRate'],['opening-label','openingPercent']]){
  const visible=!direct&&year>2011;
  el(id).hidden=!visible;
  fields[key].required=visible;
 }
 const percent=referenceDownPercent(year);
 const price=fields.price.valueAsNumber;
 el('minimum').textContent='Referencia: '+percent+'%'+(price>0?' · '+money(price*percent/100):'');
 el('result').hidden=true;
}
form.addEventListener('input',update);
form.onsubmit=event=>{
 event.preventDefault();
 el('error').textContent='';
 const input=Object.fromEntries(new FormData(form));
 try{
  const quote=quoteFinancing({...input,year:Number(input.year),price:Number(input.price),down:Number(input.down),
   months:Number(input.months),monthlyRate:input.monthlyRate===''?NaN:Number(input.monthlyRate),
   openingPercent:input.openingPercent===''?NaN:Number(input.openingPercent),insurance:input.insurance===''?null:Number(input.insurance)});
  const summary=el('summary');
  summary.replaceChildren();
  for(const [label,value] of [['Esquema',input.lender],['Año del vehículo',input.year],['Precio',money(+input.price)],['Enganche',money(+input.down)],['Plazo',input.months+' meses'],['Monto financiado',money(quote.principal)],['Tasa mensual sobre saldo insoluto',quote.rate+'%'],['Comisión de apertura',money(quote.commission)],['Primer pago mensual estimado',money(quote.payments[0].total)],['Pago inicial estimado'+(input.insurance===''?' sin seguro':''),money(quote.initial)]]){
   const dt=document.createElement('dt'), dd=document.createElement('dd');
   dt.textContent=label;dd.textContent=value;summary.append(dt,dd);
  }
  el('note').textContent=input.lender==='CLASA'
   ?'GPS: instalación '+money(gps.installation)+' y servicio mensual '+money(gps.monthly)+'. Tarifas de referencia sujetas a cambios sin previo aviso antes de la contratación, conforme a las condiciones del proveedor. Los importes definitivos se confirmarán al formalizar la operación.'
   :'Solo incluye la tasa, apertura y seguro ingresados. Confirma impuestos y cargos aplicables con la financiera.';
  const rows=el('payments');rows.replaceChildren();
  for(const row of quote.payments){
   const tr=rows.insertRow();
   for(const value of [row.period,...[row.capital,row.interest,row.gps,row.total,row.balance].map(money)])tr.insertCell().textContent=value;
  }
  el('result').hidden=false;
 }catch(error){el('error').textContent=error.message;el('result').hidden=true;}
};
el('print').onclick=()=>window.print();
update();
</script></html>
