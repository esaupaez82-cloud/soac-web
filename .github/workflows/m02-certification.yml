name: Certificación técnica M02 - simulación sin datos reales
on:
  push:
    branches:
      - fix/m02-preview-oauth-config-20261122
    paths:
      - public/soac-portal.js
      - public/soac-m02-editor.js
      - public/firebase-applet-config.json
      - tests/m02-web-certification.test.js
      - .github/workflows/m02-certification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-m02-with-mocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation (M02 scripts)
        run: |
          node --check public/soac-portal.js
          node --check public/soac-m02-editor.js
      - name: M02 simulated read and write regression tests
        run: node --test tests/m02-web-certification.test.js
