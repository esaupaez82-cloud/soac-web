name: Firebase OAuth configuration probe (read only)
on:
  push:
    branches:
      - fix/m02-preview-oauth-config-20261122
    paths:
      - tests/oauth-domain-probe.mjs
      - .github/workflows/oauth-config-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public Firebase authorized domain configuration
        run: node tests/oauth-domain-probe.mjs
