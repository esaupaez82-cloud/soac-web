name: SOAC Premium isolated recovery checks
on:
  push:
    branches:
      - recovery/drive-originals-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - run: node --test tests/premium-recovery.test.js
