name: SOAC M02 Google OAuth browser smoke (unauthenticated read only)
on:
  push:
    branches: [fix/m02-preview-oauth-config-20261122]
    paths:
      - tests/m02-oauth-browser-smoke.mjs
      - .github/workflows/m02-oauth-browser-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Inspect Google OAuth popup without signing in or reading client records
        run: node tests/m02-oauth-browser-smoke.mjs
